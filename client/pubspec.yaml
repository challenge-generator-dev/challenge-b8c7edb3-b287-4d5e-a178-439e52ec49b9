name: pedidos_app
description: Aplicación móvil de pedidos con backend desplegado mediante Terraform
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 8.1.6
  dio: 5.7.0
  equatable: 2.0.7
  get_it: 8.0.3
  dartz: 0.10.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: 9.1.7
  mocktail: 1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/